study: smoke
dataset: african-wildlife.yaml
split_policy: holdout_priority_reviewed_v2
reviewed_exclusions_file: duplicate_exclusions.json
checkpoint: yolo26n.pt
ultralytics_version: 8.4.187
fractions: [0.05]
noise_levels: [0.20]
noise_type: missing_box
subset_seed: 2026
corruption_seed: 2027
training_seeds: [42]
optimizers:
  AdamW: {lr0: 0.001, momentum: 0.9, weight_decay: 0.0005}
  MuSGD: {lr0: 0.01, momentum: 0.9, weight_decay: 0.0005}
train:
  epochs: 2
  imgsz: 320
  batch: 8
  nbs: 8
  workers: 2
  device: 0
  amp: false
  deterministic: true
  warmup_epochs: 0.0
  warmup_bias_lr: 0.0
  warmup_momentum: 0.8
  lrf: 0.01
  cos_lr: false
  patience: 0
  close_mosaic: 0
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  multi_scale: 0.0
  rect: false
  cache: false
  plots: false
  save: true
  val: true
  compile: false
  cls_remap: false
evaluation: {split: val, conf: 0.001, iou: 0.7, max_det: 300, augment: false, half: false}
